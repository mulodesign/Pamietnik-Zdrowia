<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f1df"><title>Pamiętnik Zdrowia — demo</title>
<style>
:root{--bg:#faf6e9;--ink:#223e2e;--green:#286342;--light:#e8f0dd;--border:#e1decf;--orange:#f6d2ae}*{box-sizing:border-box}body{margin:0;background:#eae9e1;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:17px}button,input,textarea,select{font:inherit}button{cursor:pointer}#app{max-width:530px;min-height:100dvh;margin:auto;background:var(--bg);padding:20px 17px 98px}header{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{font-size:33px}.name{font-family:Georgia,serif;font-size:24px;font-weight:bold}.muted{color:#657568;font-size:14px}.card{background:#fffdf6;border:1px solid var(--border);border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #253e2410}h1{font:700 27px Georgia,serif;margin:8px 0 17px}h2{font-size:20px;margin:8px 0 13px}p{line-height:1.5}.faces{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.face{padding:8px 0;border:2px solid transparent;border-radius:15px;background:#f5f0e3;display:flex;align-items:center;flex-direction:column;font-size:22px}.face small{font-size:12px}.face.active{border-color:#27794d;background:#dfefcf}.primary{width:100%;padding:15px;border:0;border-radius:17px;background:var(--green);color:white;font-weight:700;font-size:18px}.secondary{background:#fffdf6;border:1px solid #a9bca7;border-radius:13px;padding:11px 14px;color:var(--ink);font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:17px 8px;min-height:92px;background:#eaf1dd;border:1px solid #c9dcc4;border-radius:17px;color:var(--ink);font-weight:700}.tile:nth-child(2){background:#e6eff2}.tile:nth-child(3){background:#fff1d8}.tile:nth-child(4){background:#f8e5e2}.tile span{display:block;font-size:24px;margin-bottom:5px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,530px);background:#fffdf7;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:7px 4px max(8px,env(safe-area-inset-bottom));z-index:3}nav button{border:0;background:none;color:#607468;font-size:12px;padding:7px 4px;min-width:60px}nav button.active{color:#205c37;font-weight:800}nav button span{display:block;font-size:24px}label{display:block;font-weight:650;margin:14px 0 6px}input,textarea,select{width:100%;padding:13px;border:1px solid #bdcdbd;border-radius:12px;background:white;color:var(--ink)}textarea{min-height:120px;resize:vertical}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{display:inline-block;background:#e6f0df;border-radius:20px;padding:5px 10px;font-size:13px;margin:2px}.entry{display:block;width:100%;text-align:left;color:var(--ink);background:#fffdf6;border:1px solid var(--border);border-radius:15px;padding:14px;margin:9px 0}.entry strong{font-size:18px}.score{font-weight:800;color:#286342}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar button{flex:1}.hidden{display:none}.notice{background:#fff1d9;padding:11px;border-radius:12px;color:#69501c;font-size:13px;line-height:1.45}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#edf2e6;border-radius:15px;padding:15px}.stat b{font-size:25px}.mini{font-size:13px}.chart{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid #bdc9b9;padding:10px 0 0}.barwrap{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;font-size:11px}.bar{width:70%;background:#69a876;border-radius:6px 6px 0 0;min-height:2px}.push{margin-top:16px}.center{text-align:center}.details{white-space:pre-wrap;line-height:1.5}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e0a063;outline-offset:2px}@media(min-width:650px){#app{box-shadow:0 5px 35px #0002}} 
</style></head><body><main id="app"></main><nav id="nav"></nav><script>
const EM=['😫','😟','🙁','😐','🙂','😊','😄'];const KEY='pz_demo_01';let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){};let view='home',mood=4,editId=null,selectedId=null,extended=false,search='',period=7;
function el(s){return document.createElement('div')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}function dt(x){return new Date(x).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'})}
function faces(v){return '<div class="faces">'+EM.map((e,i)=>'<button class="face '+(v===i+1?'active':'')+'" onclick="setMood('+(i+1)+')">'+e+'<small>'+(i+1)+'</small></button>').join('')+'</div>'}
function openView(v){view=v;render();scrollTo(0,0)}function setMood(n){mood=n;render()}
function header(){return '<header><div class="logo">📗</div><div><div class="name">Pamiętnik Zdrowia</div><div class="muted">Twój osobisty dziennik samopoczucia</div></div></header>'}
function boxNav(){let navs=[['home','⌂','Start'],['write','✎','Wpis'],['history','▤','Historia'],['analysis','▥','Analiza'],['more','⚙','Więcej']];document.getElementById('nav').innerHTML=navs.map(([id,ico,label])=>'<button class="'+(view===id?'active':'')+'" onclick="openView(\''+id+'\')"><span>'+ico+'</span>'+label+'</button>').join('')}
function home(){return '<section class="card"><h1>Jak się dzisiaj czujesz?</h1>'+faces(mood)+'<p class="muted center">Wybrana ocena: '+mood+'/7</p><button class="primary" onclick="newEntry()">🎙 Nowy wpis</button></section><div class="grid"><button class="tile" onclick="openView(\'history\')"><span>📖</span>Historia wpisów</button><button class="tile" onclick="openView(\'analysis\')"><span>📊</span>Analiza samopoczucia</button><button class="tile" onclick="openView(\'history\')"><span>🔎</span>Szukaj w pamiętniku</button><button class="tile" onclick="openView(\'more\')"><span>🔒</span>Ustawienia</button></div><section class="card push"><h2>Ostatnie wpisy</h2>'+list(records.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3))+'</section>'}
function newEntry(){editId=null;openView('write')}
function write(){let r=records.find(x=>x.id===editId);let dd=r?.date||new Date().toISOString().slice(0,10);return '<section class="card"><h1>'+(r?'Edytuj wpis':'Nowy wpis')+'</h1><label>Data</label><input id="date" type="date" value="'+dd+'"><label>Temat (opcjonalnie)</label><input id="topic" placeholder="Np. po spacerze, po zabiegu" value="'+esc(r?.topic||'')+'"><label>Ocena samopoczucia (obowiązkowa)</label>'+faces(mood)+'<label>Twoja wypowiedź / notatka</label><textarea id="entryText" placeholder="Opisz, jak się czujesz...">'+esc(r?.text||'')+'</textarea><div class="notice">Wersja demonstracyjna: wpisz tekst ręcznie. Rozpoznawanie mowy i AI nie są jeszcze podłączone. Nie wpisuj prawdziwych danych zdrowotnych.</div><button class="primary push" onclick="storeEntry()">✓ Zapisz wpis</button></section>'}
function storeEntry(){let text=document.getElementById('entryText').value.trim(),topic=document.getElementById('topic').value.trim(),date=document.getElementById('date').value;if(!text||!date){alert('Dodaj datę i treść wpisu.');return}if(editId){let r=records.find(x=>x.id===editId);Object.assign(r,{text,topic,date,mood})}else{records.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),date,text,topic,mood})}save();editId=null;openView('history')}
function list(arr){return arr.length?arr.map(r=>'<button class="entry" onclick="showDetail(\''+r.id+'\')"><div class="row"><span class="mini">'+dt(r.date)+'</span><span class="score">'+EM[r.mood-1]+' '+r.mood+'/7</span></div><strong>'+esc(r.topic||'Samopoczucie')+'</strong><p class="mini">'+esc(r.text.slice(0,120))+(r.text.length>120?'…':'')+'</p></button>').join(''):'<p class="muted">Nie ma jeszcze wpisów. Dodaj pierwszy wpis, aby zobaczyć historię.</p>'}
function history(){let s=search.toLocaleLowerCase('pl');let rs=records.filter(r=>(r.text+' '+r.topic).toLocaleLowerCase('pl').includes(s)).sort((a,b)=>b.date.localeCompare(a.date));return '<h1>Historia wpisów</h1><input id="search" placeholder="Szukaj objawu lub tematu" value="'+esc(search)+'" oninput="search=this.value;refreshList()"><div id="results">'+list(rs)+'</div>'}
function refreshList(){let c=document.getElementById('results');if(c)c.innerHTML=list(records.filter(r=>(r.text+' '+r.topic).toLocaleLowerCase('pl').includes(search.toLocaleLowerCase('pl'))).sort((a,b)=>b.date.localeCompare(a.date)))}
function showDetail(id){selectedId=id;openView('detail')}
function detail(){let r=records.find(x=>x.id===selectedId);if(!r)return '<p>Nie znaleziono wpisu.</p>';return '<button class="secondary" onclick="openView(\'history\')">← Historia</button><section class="card push"><div class="row"><span>'+dt(r.date)+'</span><strong class="score">'+EM[r.mood-1]+' '+r.mood+'/7</strong></div><h1>'+esc(r.topic||'Samopoczucie')+'</h1><h2>Oryginalny tekst</h2><div class="details">'+esc(r.text)+'</div><div class="toolbar push"><button class="secondary" onclick="editEntry()">✎ Edytuj</button><button class="secondary" onclick="removeEntry()">Usuń</button></div></section>'}
function editEntry(){let r=records.find(x=>x.id===selectedId);editId=r.id;mood=r.mood;openView('write')}
function removeEntry(){if(confirm('Czy na pewno usunąć wpis?')){records=records.filter(x=>x.id!==selectedId);save();openView('history')}}
function averages(){let cutoff=new Date();cutoff.setDate(cutoff.getDate()-period+1);cutoff.setHours(0,0,0,0);let rec=records.filter(r=>new Date(r.date+'T12:00:00')>=cutoff),by={};rec.forEach(r=>(by[r.date]??=[]).push(r.mood));let days=Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0])).map(([day,v])=>({day,score:v.reduce((a,b)=>a+b,0)/v.length}));return {rec,days,avg:days.length?(days.reduce((a,d)=>a+d.score,0)/days.length).toFixed(1).replace('.',','):'—'}}
function analysis(){let {rec,days,avg}=averages();let bars=days.map(d=>'<div class="barwrap"><div class="bar" style="height:'+((d.score/7)*100)+'%"></div><span>'+new Date(d.day+'T12:00:00').toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})+'</span></div>').join('');let topics={};rec.forEach(r=>{let t=r.topic||'Bez tematu';topics[t]=(topics[t]||0)+1});return '<h1>Analiza samopoczucia</h1><section class="card"><label>Okres</label><select id="period" onchange="period=Number(this.value);render()"><option value="7" '+(period===7?'selected':'')+'>Ostatnie 7 dni</option><option value="30" '+(period===30?'selected':'')+'>Ostatnie 30 dni</option><option value="90" '+(period===90?'selected':'')+'>Ostatnie 90 dni</option></select><div class="toolbar"><button class="secondary" onclick="extended=false;render()">Prosta '+(!extended?'✓':'')+'</button><button class="secondary" onclick="extended=true;render()">Rozszerzona '+(extended?'✓':'')+'</button></div><div class="stats"><div class="stat"><span class="mini">Średnia dzienna</span><br><b>'+avg+'/7</b></div><div class="stat"><span class="mini">Liczba wpisów</span><br><b>'+rec.length+'</b></div></div><p class="muted">Oceny z '+days.length+' dni z zapisami. Brak wpisu nie oznacza złego samopoczucia.</p>'+(extended?'<h2>Ocena w czasie</h2><div class="chart">'+bars+'</div><h2>Tematy</h2>'+Object.entries(topics).map(([t,n])=>'<p>'+esc(t)+': <b>'+n+'</b></p>').join('')+'<h2>Wpisy z okresu</h2>'+list(rec.sort((a,b)=>b.date.localeCompare(a.date))):'<p>'+ (rec.length?'Otwórz analizę rozszerzoną, aby obejrzeć oceny dzienne i tematy.':'Zapisz kilka obserwacji, aby zobaczyć podsumowanie.')+'</p>')+'</section>'}
function more(){return '<h1>Więcej</h1><section class="card"><h2>O prototypie</h2><p>To demonstracja interfejsu Pamiętnika Zdrowia dla rodziny. Dane są zapisywane w pamięci tej przeglądarki, ale <b>nie są zaszyfrowane</b> i mogą zostać usunięte przez przeglądarkę.</p><div class="notice">Nie wprowadzaj rzeczywistych danych dotyczących zdrowia. Ta wersja nie ma jeszcze PIN-u, kopii zapasowych ani bezpiecznej bazy danych.</div><button class="secondary push" onclick="addDemo()">Dodaj fikcyjne wpisy do testów</button><button class="secondary push" onclick="clearDemo()">Usuń wszystkie wpisy demonstracyjne</button></section>'}
function addDemo(){if(records.length&&!confirm('Dodać fikcyjne wpisy do istniejącej historii?'))return;let data=[['Po spacerze','Dziś miałem więcej energii i byłem spokojny.',6,0],['Po gorszej nocy','Rano czułem się senny i zmęczony.',3,1],['Zwykły dzień','Dobre samopoczucie, bez większych dolegliwości.',5,2]];data.forEach(([topic,text,mood,offset])=>{let d=new Date();d.setDate(d.getDate()-offset);records.push({id:Date.now()+'-'+offset+'-'+Math.random(),topic,text,mood,date:d.toISOString().slice(0,10)})});save();openView('history')}
function clearDemo(){if(confirm('Usunąć wszystkie wpisy z tej przeglądarki?')){records=[];save();openView('home')}}
function render(){document.getElementById('app').innerHTML=header()+(view==='home'?home():view==='write'?write():view==='history'?history():view==='detail'?detail():view==='analysis'?analysis():more());boxNav()}
render();
</script></body></html>
